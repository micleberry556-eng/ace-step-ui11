# ACE-Step UI — Docker Deployment
#
# Usage:
#   docker compose up --build
#
# Access the app at http://localhost
#
# The UI (frontend + backend) starts immediately.
# AI music generation requires the ACE-Step model running separately
# on a machine with an NVIDIA GPU (see README for instructions).

services:
  # ── Backend (Express + SQLite) ──────────────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_PATH: /app/data/acestep.db
      AUDIO_DIR: /app/public/audio
      FRONTEND_URL: "http://localhost:${FRONTEND_PORT:-80}"
      JWT_SECRET: "${JWT_SECRET:-ace-step-ui-local-secret}"
      PEXELS_API_KEY: "${PEXELS_API_KEY:-}"
      # AI model API URL. Change this if the model runs on another machine.
      # Default: host machine on port 8001
      ACESTEP_API_URL: "${ACESTEP_API_URL:-http://host.docker.internal:8001}"
    volumes:
      - db-data:/app/data
      - audio-data:/app/public/audio
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── Frontend (nginx + React build) ─────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
    driver: local
  audio-data:
    driver: local
