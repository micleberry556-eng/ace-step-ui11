# ACE-Step UI — Full Stack (AI Model + Backend + Frontend)
#
# Requirements:
#   - NVIDIA GPU with 4GB+ VRAM
#   - nvidia-container-toolkit installed on the host
#     (see https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html)
#
# Usage:
#   docker compose up --build
#
# First run downloads ~5GB of AI models. Check progress:
#   docker compose logs -f model
#
# Access the app at http://localhost

services:
  # ── AI Model (ACE-Step 1.5 with CUDA) ───────────────────────────────────
  model:
    build:
      context: ./model
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8001}:8001"
    volumes:
      # Persist downloaded models (~5GB) across container restarts
      - model-cache:/app/checkpoints
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/gradio_api/info"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  # ── Backend (Express + SQLite) ──────────────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_PATH: /app/data/acestep.db
      AUDIO_DIR: /app/public/audio
      FRONTEND_URL: "http://localhost:${FRONTEND_PORT:-80}"
      JWT_SECRET: "${JWT_SECRET:-ace-step-ui-local-secret}"
      PEXELS_API_KEY: "${PEXELS_API_KEY:-}"
      # Connect to the model container by service name
      ACESTEP_API_URL: "http://model:8001"
    volumes:
      - db-data:/app/data
      - audio-data:/app/public/audio
    depends_on:
      model:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── Frontend (nginx + React build) ─────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  model-cache:
    driver: local
  db-data:
    driver: local
  audio-data:
    driver: local
